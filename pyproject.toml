[project]
name = "perfcho"
version = "0.1.0"
description = "Our attempt to build a high-performance osu! server implementation in modern Python 3.14"
requires-python = ">=3.14,<3.15"
authors = [
    {name = "TuRou", email = "truerou@outlook.com"}
]
dependencies = [
    "aioboto3>=15.5.0",
    "apscheduler>=4.0.0a6,<5",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "bcrypt>=4.3.0",
    "fastapi>=0.123.0",
    "greenlet>=3.2.0",
    "httpx>=0.28.0",
    "loguru>=0.7.3",
    "msgpack>=1.1,<2",
    "loki-logger-handler>=1.1.2",
    "orjson>=3.11.0,<4",
    "prompt-toolkit>=3.0.53",
    "pymysql>=1.1.2",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.20",
    "redis>=8.0.1",
    "requests>=2.32.3",
    "sqlalchemy==2.0.52",
    "taskiq>=0.12.4",
    "taskiq-redis>=1.2.3",
    "uvicorn>=0.38.0",
    "aiosignalr",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "osu @ git+https://github.com/Lekuruu/osu.py.git@31a51dc323ae151fe711bb0cb22bd266abdaa500",
    "pytest>=9.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.15.22",
    "types-aioboto3[s3]>=15.5.0",
    "types-pymysql>=1.2.0.20260807",
]

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
override-dependencies = ["sqlalchemy==2.0.52"]
prerelease = "allow"

[tool.uv.sources]
aiosignalr = { path = "../aiosignalr" }

[tool.ruff]
line-length = 120
exclude = [".agent-space"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "D"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"src/perfcho/infra/cache/backend.py" = ["D102", "D107"]
"src/perfcho/infra/cache/decorator.py" = ["UP047"]
"src/perfcho/infra/cache/memory.py" = ["D102", "D107"]
"src/perfcho/infra/cache/redis.py" = ["D102", "D107"]
"src/perfcho/infra/cache/values.py" = ["ANN401", "D103"]
"src/perfcho/modules/community/queries.py" = ["D102", "D107"]
"src/perfcho/modules/social/queries.py" = ["D102", "D107"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]
asyncio_mode = "auto"
markers = ["postgres: requires the PostgreSQL Compose service"]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
