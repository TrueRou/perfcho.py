services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: perfcho
      POSTGRES_USER: perfcho
      POSTGRES_PASSWORD: perfcho
    ports:
      - "127.0.0.1:${FAKECLIENT_POSTGRES_PORT:-57432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perfcho -d perfcho"]
      interval: 1s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:${FAKECLIENT_REDIS_PORT:-57379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:latest
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: perfcho
      MINIO_ROOT_PASSWORD: perfcho-fakeclient
    ports:
      - "127.0.0.1:${FAKECLIENT_MINIO_PORT:-59100}:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 1s
      timeout: 3s
      retries: 30

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set fakeclient http://minio:9000 perfcho perfcho-fakeclient &&
        mc mb --ignore-existing fakeclient/perfcho
