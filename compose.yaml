services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: perfcho
      POSTGRES_USER: perfcho
      POSTGRES_PASSWORD: perfcho
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - perfcho-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perfcho -d perfcho"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - perfcho-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  perfcho-postgres:
  perfcho-redis:
