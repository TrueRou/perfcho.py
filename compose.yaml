services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: perfcho
      POSTGRES_USER: perfcho
      POSTGRES_PASSWORD: perfcho
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - perfcho-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perfcho -d perfcho"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - perfcho-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: perfcho
      MINIO_ROOT_PASSWORD: perfcho-development
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    volumes:
      - perfcho-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set perfcho http://minio:9000 perfcho perfcho-development &&
        mc mb --ignore-existing perfcho/perfcho
    restart: "no"

volumes:
  perfcho-postgres:
  perfcho-redis:
  perfcho-minio:
