name: perfcho-production

x-app-environment: &app-environment
  APP_HOST: 0.0.0.0
  APP_PORT: 8000
  APP_DEBUG: "false"
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  CORS_ORIGINS: '${CORS_ORIGINS:-[]}'
  DATABASE_URL: postgresql+asyncpg://perfcho:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/perfcho
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
  DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-5}
  REDIS_STATE_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
  TASKIQ_BROKER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/1
  PASSWORD_PEPPER: ${PASSWORD_PEPPER:?PASSWORD_PEPPER must be set}
  TOKEN_HMAC_KEY: ${TOKEN_HMAC_KEY:?TOKEN_HMAC_KEY must be set}
  DEVICE_HMAC_KEY: ${DEVICE_HMAC_KEY:?DEVICE_HMAC_KEY must be set}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:?S3_ENDPOINT_URL must be set}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set}
  S3_BUCKET: ${S3_BUCKET:-perfcho}
  S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-path}

x-app: &app
  image: ${PERFCHO_IMAGE:-perfcho:latest}
  environment: *app-environment
  init: true
  restart: unless-stopped
  stop_grace_period: 30s

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: perfcho
      POSTGRES_USER: perfcho
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - perfcho-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perfcho -d perfcho"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s

  redis:
    image: redis:8-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - perfcho-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$${REDIS_PASSWORD} redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 30s

  migrate:
    <<: *app
    build:
      context: .
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    init: false
    restart: "no"

  api:
    <<: *app
    command: ["uvicorn", "perfcho.main:asgi_app", "--host", "0.0.0.0", "--port", "8000", "--no-server-header"]
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PUBLISHED_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; raise SystemExit(urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3).status != 200)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  relay:
    <<: *app
    command: ["python", "-m", "perfcho.infra.outbox"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  taskiq:
    <<: *app
    command:
      - taskiq
      - worker
      - perfcho.infra.taskiq:broker
      - perfcho.tasks.outbox
      - --ack-type
      - when_executed
      - --workers
      - ${TASKIQ_WORKERS:-2}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  perfcho-postgres:
  perfcho-redis:
